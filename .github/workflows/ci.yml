name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      HAS_SUPABASE_DB_LINT_SECRETS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-1234567890abcdef123456
          NEXT_PUBLIC_SITE_URL: https://ci.merchtent.app
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-1234567890abcdef
          STRIPE_SECRET_KEY: sk_test_ci_1234567890abcdef
          STRIPE_WEBHOOK_SECRET: whsec_ci_1234567890abcdef
          POSTMARK_SERVER_TOKEN: ci-postmark-token-1234567890
          POSTMARK_FROM: support@merchtent.com.au
          POSTMARK_ADMIN_TO: ops@merchtent.example
          POSTMARK_SUPPORT_EMAIL: support@merchtent.com.au
          MOBILEMESSAGE_USERNAME: ci-mobilemessage-user
          MOBILEMESSAGE_PASSWORD: ci-mobilemessage-password
          PRINTIFY_API_TOKEN: ci-printify-token-1234567890
          PRINTIFY_SHOP_ID: ci-printify-shop
          PRINTIFY_DEFAULT_BLUEPRINT_ID: 1
          PRINTIFY_DEFAULT_PRINT_PROVIDER_ID: 1
          PRINTIFY_DEFAULT_VARIANT_IDS: 1,2
          OPERATIONAL_HEALTH_SECRET: ci-operational-health-secret-32-chars
        run: npm run release:check

      - name: Require Supabase DB lint secrets on main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SUPABASE_DB_LINT_SECRETS != 'true' }}
        run: |
          echo "SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are required on main pushes so DB lint is not skipped."
          exit 1

      - name: Supabase DB lint
        if: ${{ env.HAS_SUPABASE_DB_LINT_SECRETS == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase db lint --project-ref "$SUPABASE_PROJECT_REF" --level warning --fail-on error
