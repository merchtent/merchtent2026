name: CI

on:
  pull_request:
    branches:
      - main
      - uat
  push:
    branches:
      - main
      - uat

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promotion-policy:
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require UAT promotion
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "uat" ]; then
            echo "Production changes must be promoted from the uat branch."
            exit 1
          fi

  verify:
    runs-on: ubuntu-latest
    env:
      HAS_SUPABASE_DB_LINT_SECRETS: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release check
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-1234567890abcdef123456
          NEXT_PUBLIC_SITE_URL: https://ci.merchtent.app
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-1234567890abcdef
          STRIPE_SECRET_KEY: sk_test_ci_1234567890abcdef
          STRIPE_WEBHOOK_SECRET: whsec_ci_1234567890abcdef
          POSTMARK_SERVER_TOKEN: ci-postmark-token-1234567890
          POSTMARK_FROM: support@merchtent.com.au
          POSTMARK_ADMIN_TO: ops@merchtent.example
          POSTMARK_SUPPORT_EMAIL: support@merchtent.com.au
          MOBILEMESSAGE_USERNAME: ci-mobilemessage-user
          MOBILEMESSAGE_PASSWORD: ci-mobilemessage-password
          PRINTIFY_API_TOKEN: ci-printify-token-1234567890
          PRINTIFY_SHOP_ID: ci-printify-shop
          PRINTIFY_DEFAULT_BLUEPRINT_ID: 1
          PRINTIFY_DEFAULT_PRINT_PROVIDER_ID: 1
          PRINTIFY_DEFAULT_VARIANT_IDS: 1,2
          OPERATIONAL_HEALTH_SECRET: ci-operational-health-secret-32-chars
          SENTRY_DSN: https://ci-public-key@o1.ingest.sentry.io/1
          NEXT_PUBLIC_SENTRY_DSN: https://ci-public-key@o1.ingest.sentry.io/1
          SENTRY_ORG: ci-merch-tent
          SENTRY_PROJECT: ci-web
          SENTRY_AUTH_TOKEN: ci-sentry-auth-token-123456
        run: npm run release:check

      - name: Require Supabase DB lint secrets on production
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SUPABASE_DB_LINT_SECRETS != 'true' }}
        run: |
          echo "SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF are required on main pushes so DB lint is not skipped."
          exit 1

      - name: Supabase DB lint
        if: ${{ env.HAS_SUPABASE_DB_LINT_SECRETS == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase db lint --project-ref "$SUPABASE_PROJECT_REF" --level warning --fail-on error

  production-environment:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
      POSTMARK_FROM: support@merchtent.com.au
      POSTMARK_ADMIN_TO: ${{ secrets.POSTMARK_ADMIN_TO }}
      POSTMARK_SUPPORT_EMAIL: support@merchtent.com.au
      MOBILEMESSAGE_USERNAME: ${{ secrets.MOBILEMESSAGE_USERNAME }}
      MOBILEMESSAGE_PASSWORD: ${{ secrets.MOBILEMESSAGE_PASSWORD }}
      PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
      PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
      PRINTIFY_DEFAULT_BLUEPRINT_ID: ${{ secrets.PRINTIFY_DEFAULT_BLUEPRINT_ID }}
      PRINTIFY_DEFAULT_PRINT_PROVIDER_ID: ${{ secrets.PRINTIFY_DEFAULT_PRINT_PROVIDER_ID }}
      PRINTIFY_DEFAULT_VARIANT_IDS: ${{ secrets.PRINTIFY_DEFAULT_VARIANT_IDS }}
      OPERATIONAL_HEALTH_SECRET: ${{ secrets.OPERATIONAL_HEALTH_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Certify production environment
        run: node scripts/validate-production-env.mjs
